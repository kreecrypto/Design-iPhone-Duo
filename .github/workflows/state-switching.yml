name: State switching browser QA

on:
  push:
    branches: [main]
    paths:
      - index.html
      - src/export-compositor.js
      - tests/state-switching.browser.test.mjs
      - .github/workflows/state-switching.yml
  pull_request:
    paths:
      - index.html
      - src/export-compositor.js
      - tests/state-switching.browser.test.mjs
      - .github/workflows/state-switching.yml

permissions:
  contents: read

jobs:
  state-switching:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify T048 state switching acceptance
        run: node tests/state-switching.browser.test.mjs
