name: View modes browser QA

on:
  push:
    branches: [main]
    paths:
      - index.html
      - src/export-compositor.js
      - tests/view-modes.browser.test.mjs
      - .github/workflows/view-modes.yml
  pull_request:
    paths:
      - index.html
      - src/export-compositor.js
      - tests/view-modes.browser.test.mjs
      - .github/workflows/view-modes.yml

permissions:
  contents: read

jobs:
  view-modes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify T022 T023 view mode state retention
        run: node tests/view-modes.browser.test.mjs
