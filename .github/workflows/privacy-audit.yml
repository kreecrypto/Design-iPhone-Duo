name: T062 network and storage privacy audit

on:
  push:
    branches: [main]
    paths:
      - index.html
      - src/export-compositor.js
      - tests/privacy-audit.browser.test.mjs
      - .github/workflows/privacy-audit.yml
  pull_request:
    paths:
      - index.html
      - src/export-compositor.js
      - tests/privacy-audit.browser.test.mjs
      - .github/workflows/privacy-audit.yml

permissions:
  contents: read

jobs:
  privacy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify T062 network/storage privacy acceptance
        run: node tests/privacy-audit.browser.test.mjs
