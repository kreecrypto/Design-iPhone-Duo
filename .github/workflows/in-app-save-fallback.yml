name: In-app save fallback QA

on:
  push:
    branches: [main]
    paths:
      - src/export-compositor.js
      - tests/in-app-save-fallback.browser.test.mjs
      - .github/workflows/in-app-save-fallback.yml
  pull_request:
    paths:
      - src/export-compositor.js
      - tests/in-app-save-fallback.browser.test.mjs
      - .github/workflows/in-app-save-fallback.yml

permissions:
  contents: read

jobs:
  in-app-save-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify T040 in-app save fallback
        run: node tests/in-app-save-fallback.browser.test.mjs
