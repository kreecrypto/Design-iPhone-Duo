name: Demo assets

on:
  push:
    branches: [main]
    paths:
      - 'public/demo/**'
      - 'tests/demo-assets.test.mjs'
      - '.github/workflows/demo-assets.yml'
  pull_request:
    paths:
      - 'public/demo/**'
      - 'tests/demo-assets.test.mjs'
      - '.github/workflows/demo-assets.yml'
  workflow_dispatch:

jobs:
  demo-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify synthetic demo assets
        run: node tests/demo-assets.test.mjs
