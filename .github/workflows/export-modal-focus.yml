name: Export modal focus QA

on:
  push:
    branches: [main]
    paths:
      - src/export-compositor.js
      - tests/export-modal-focus.browser.test.mjs
      - .github/workflows/export-modal-focus.yml
  pull_request:
    paths:
      - src/export-compositor.js
      - tests/export-modal-focus.browser.test.mjs
      - .github/workflows/export-modal-focus.yml

permissions:
  contents: read

jobs:
  export-modal-focus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify T043 export modal focus management
        run: node tests/export-modal-focus.browser.test.mjs
