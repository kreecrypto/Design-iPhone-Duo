name: Privacy and upload guards

on:
  push:
    branches: [main]
    paths:
      - index.html
      - tests/privacy-network.test.mjs
      - tests/upload-matrix.test.mjs
      - .github/workflows/privacy-local-only.yml
  pull_request:
    paths:
      - index.html
      - tests/privacy-network.test.mjs
      - tests/upload-matrix.test.mjs
      - .github/workflows/privacy-local-only.yml

permissions:
  contents: read

jobs:
  browser-local-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify screenshot handling stays local-only
        run: node tests/privacy-network.test.mjs
      - name: Verify upload format matrix
        run: node tests/upload-matrix.test.mjs
