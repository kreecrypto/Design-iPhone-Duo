name: Export compositor browser QA

on:
  push:
    branches: [main]
    paths:
      - index.html
      - src/export-compositor.js
      - tests/export-compositor.browser.test.mjs
      - .github/workflows/export-compositor.yml
  pull_request:
    paths:
      - index.html
      - src/export-compositor.js
      - tests/export-compositor.browser.test.mjs
      - .github/workflows/export-compositor.yml

permissions:
  contents: read

jobs:
  export-compositor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify T029 export compositor scopes and parity
        run: node tests/export-compositor.browser.test.mjs
