name: Responsive shell viewport QA

on:
  push:
    branches: [main]
    paths:
      - index.html
      - tests/responsive-shell.browser.test.mjs
      - .github/workflows/responsive-shell.yml
  pull_request:
    paths:
      - index.html
      - tests/responsive-shell.browser.test.mjs
      - .github/workflows/responsive-shell.yml

permissions:
  contents: read

jobs:
  responsive-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify 320/375/768/1024/1440 responsive shell
        run: node tests/responsive-shell.browser.test.mjs
